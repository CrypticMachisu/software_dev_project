<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M-DUKA — multi-seller marketplace</title>
<style>
/* ===== M-DUKA storefront design system =====
   Warm paper, terracotta accent, Fraunces display + Instrument Sans body. */
@import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400..700&display=swap");

:root{
  --bg:#f7f2e8; --card:#fffcf4; --ink:#272b1f; --mute:#6f6653;
  --line:#e7ddc8; --line-2:#efe8d9;
  --acc:#b04f2a; --acc-deep:#8f3e20; --acc-ink:#fff8f1; --acc-soft:#f5e6d9;
  --go:#2f6440; --go-soft:#e2eddf;
  --warn:#7a5217; --warn-soft:#f3ead3;
  --bad:#b23b34; --bad-soft:#f6e2de;
  --chip:#f0e9d8;
  --star:#d9972f;
  --shadow:0 1px 2px rgba(66,55,34,.05),0 14px 34px -16px rgba(66,55,34,.20);
  --shadow-soft:0 1px 2px rgba(66,55,34,.04),0 8px 22px -14px rgba(66,55,34,.16);
  --r-lg:18px; --r-sm:10px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --t-xs:12px;--t-sm:14px;--t-md:16px;--t-lg:20px;--t-xl:25px;--t-2xl:31px;--t-3xl:39px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --dur-1:120ms; --dur-2:180ms; --dur-3:240ms;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#17140e; --card:#211d15; --ink:#ece3cf; --mute:#a09477;
    --line:#38301e; --line-2:#2e2818;
    --acc:#d67c4b; --acc-deep:#e08a5c; --acc-ink:#221004; --acc-soft:#332015;
    --go:#82bd90; --go-soft:#1f2c22;
    --warn:#d9a44c; --warn-soft:#312513;
    --bad:#e07f7a; --bad-soft:#3a1e1b;
    --chip:#2b2518;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 38px -18px rgba(0,0,0,.55);
    --shadow-soft:0 1px 2px rgba(0,0,0,.35),0 10px 26px -16px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 "Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:560;line-height:1.15;letter-spacing:-.015em;margin:0 0 .55rem}
h1{font-size:clamp(1.75rem,1.25rem+1.6vw,2.35rem)}
h2{font-size:1.3rem}h3{font-size:1.05rem}
a{color:var(--acc);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.skip{position:fixed;left:1rem;top:-4rem;z-index:100;background:var(--card);color:var(--ink);
  padding:.7rem 1rem;border-radius:999px;border:1px solid var(--line);box-shadow:var(--shadow)}
.skip:focus{top:1rem}
#app:focus{outline:none}
nav .pill,aside .fcat,.btn,button,summary{min-height:44px}
aside .fcat{padding:.55rem .78rem}

/* ---- announce strip + top bar ---- */
.announce{display:block;text-align:center;padding:.36rem 1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  background:var(--acc);color:var(--acc-ink)}
.announce .sep{margin:0 .55rem;opacity:.6}
nav{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
  padding:.7rem clamp(1rem,4vw,2rem);position:sticky;top:0;z-index:5;
  background:color-mix(in srgb,var(--card) 85%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .brand{font:italic 600 1.5rem/1 Fraunces,Georgia,serif;color:var(--ink);letter-spacing:-.01em}
nav .brand:hover{text-decoration:none}
nav .brand::after{content:".";color:var(--acc)}
nav .brand-sub{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.16em;
  line-height:1.5;color:var(--mute);margin-left:-.15rem}
nav .sp{flex:1}
nav .pill{display:inline-flex;gap:.45rem;align-items:center;padding:.42rem .95rem;
  border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:.9rem;color:var(--ink);
  background:var(--card);transition:border-color .2s,color .2s,background .2s}
nav .pill:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft);text-decoration:none}
nav .badge{display:inline-grid;place-items:center;min-width:1.35rem;height:1.35rem;padding:0 .32rem;
  border-radius:999px;background:var(--acc);color:var(--acc-ink);font-size:.72rem;font-weight:700;
  font-variant-numeric:tabular-nums}
nav .who{color:var(--mute);font-size:.9rem;padding-left:.35rem}
nav .quiet{color:var(--mute);font-size:.9rem}
nav .quiet:hover{color:var(--bad)}
.search{position:relative;display:inline-flex;align-items:center;width:min(300px,100%)}
.search svg{position:absolute;left:.85rem;width:15px;height:15px;color:var(--mute);pointer-events:none}
#q{border-radius:999px;background:var(--bg);padding-left:2.4rem;transition:background .25s,box-shadow .25s}
#q:focus{background:var(--card);box-shadow:0 0 0 3px var(--acc-soft)}
main{max-width:1140px;margin:0 auto;padding:1.7rem clamp(1rem,4vw,2rem) 4.5rem}

/* ---- layout ---- */
.layout,.two{display:grid;grid-template-columns:1fr;gap:1.7rem;align-items:start}
@media(min-width:880px){
  .layout{grid-template-columns:220px 1fr}
  .two{grid-template-columns:1fr 340px}
  aside{position:sticky;top:4.6rem}
}
nav .brand-sub,nav .who{display:none}
nav .search{order:9;width:100%;max-width:none}
@media(min-width:760px){
  nav .brand-sub{display:inline}
  nav .who{display:inline}
  nav .search{order:0;width:min(300px,100%)}
}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}

/* ---- panels ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.15rem;box-shadow:var(--shadow-soft)}
aside{position:static}
aside h3{font-size:.74rem;font-family:inherit;text-transform:uppercase;letter-spacing:.11em;
  color:var(--mute);margin:1.35rem 0 .45rem}
aside h3:first-child{margin-top:.15rem}
aside .fcats{display:flex;flex-direction:column;gap:.15rem}
aside .fcat{display:flex;justify-content:space-between;align-items:center;gap:.6rem;
  padding:.42rem .78rem;border-radius:999px;color:var(--ink);font-size:.92rem;
  transition:background .18s,color .18s}
aside .fcat:hover{background:var(--acc-soft);text-decoration:none}
aside .fcat.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
aside .fcat.on:hover{background:var(--acc-deep)}
aside .cnt{font-size:.72rem;color:var(--mute);font-variant-numeric:tabular-nums}
aside .fcat.on .cnt{color:var(--acc-ink);opacity:.72}
aside .prange{display:flex;align-items:center;gap:.4rem;max-width:190px}
aside .prange input{padding:.42rem .62rem;font-size:.9rem}
aside .prange .dash{color:var(--mute)}
aside .fbtns{display:flex;gap:.5rem;margin-top:.6rem}
aside .fhint{margin-top:.55rem;font-size:.76rem}
.empty{display:grid;place-items:center;text-align:center;padding:2.6rem 1.2rem;margin-top:.8rem;gap:.2rem}

/* ---- product grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:1.05rem}
.grid>.card{padding:.55rem .55rem 1rem;border-radius:var(--r-lg);transition:box-shadow var(--dur-2) var(--ease)}
.grid>.card a:hover{text-decoration:none}
@media(hover:hover){.grid>.card:hover a{text-decoration:underline}}
@media(hover:hover) and (pointer:fine){
 .grid>.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);transition:transform 140ms var(--ease),box-shadow 140ms var(--ease)}
 .product-card .card-link:hover .media{transform:scale(1.02)}
}
.media{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:calc(var(--r-lg) - 6px);background:var(--chip)}
.media.big{aspect-ratio:4/5;border-radius:var(--r-lg)}
.media svg{position:absolute;inset:0;width:100%;height:100%}
.media img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
.card.row>.media{width:64px;flex:none;aspect-ratio:1;border-radius:10px}
.table .media{width:56px;aspect-ratio:1;border-radius:8px}
.price{font-family:Fraunces,Georgia,serif;font-weight:620;font-size:1.08rem;font-variant-numeric:tabular-nums}

/* ---- seller analytics ---- */
.seller-stats .card{flex:1 1 150px}
.seller-stats .stat-card{background:var(--acc-soft);border-color:var(--acc)}
.seller-stats h2{margin:.15rem 0 0;font-size:1.55rem}
.bars{display:flex;align-items:flex-end;gap:.4rem;height:96px;margin-top:.7rem}
.bars .b{flex:1;min-height:3px;background:linear-gradient(180deg,var(--acc),var(--acc-soft));
  border-radius:5px 5px 2px 2px;transition:opacity .2s}
.bars .b:hover{opacity:.72}

/* ---- buttons ---- */
.btn,button{font:inherit;font-weight:600;padding:.55rem 1.15rem;border-radius:999px;
  border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);cursor:pointer;
  transition:transform 90ms var(--ease),background var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.btn:hover,button:hover{background:var(--acc-deep);border-color:var(--acc-deep);
  transform:translateY(-1px);box-shadow:var(--shadow-soft);text-decoration:none;color:var(--acc-ink)}
.btn:active,button:active{transform:scale(.985);box-shadow:none}
.btn.ghost,button.ghost{background:transparent;color:var(--acc);border-color:var(--acc)}
.btn.ghost:hover,button.ghost:hover{background:var(--acc-soft);color:var(--acc);transform:translateY(-1px)}
button.sm{padding:.3rem .75rem;font-size:.85rem}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

/* ---- forms ---- */
input,select,textarea{font:inherit;width:100%;padding:.52rem .7rem;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=checkbox],input[type=radio]{width:auto}
label{display:block;margin:.75rem 0 .28rem;font-weight:600;font-size:.82rem}
.row{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute);font-size:.88rem}

/* ---- status chips: tinted, never raw color ---- */
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .7rem;border-radius:999px;
  background:var(--chip);color:var(--ink);font-size:.78rem;font-weight:600}
.chip.ok{background:var(--go-soft);color:var(--go)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);
  font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
td{text-align:left;padding:.62rem .5rem;border-bottom:1px solid var(--line-2);vertical-align:middle}

/* ---- order steps ---- */
.steps{display:flex;gap:.4rem;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--acc);opacity:.35;transition:opacity .2s}
.dot.on{opacity:1}
.bar{width:28px;height:2px;background:var(--line);border-radius:2px}
.group{background:var(--chip);padding:.5rem .85rem;font-size:.84rem;font-weight:600;border-radius:999px;margin:1rem 0 .5rem}
.err{color:var(--bad);margin:.5rem 0;font-size:.9rem}
.ok{color:var(--go)}

/* ---- modal, toast, reviews ---- */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:rgba(24,18,10,.45);backdrop-filter:blur(4px);animation:fade .2s ease-out}
.modal .card{width:min(440px,92vw);border-radius:22px;box-shadow:var(--shadow);position:relative}
.modal-close{position:absolute;right:.7rem;top:.6rem;min-width:44px;min-height:44px;
  background:transparent;border:1px solid var(--line);color:var(--ink);font-size:1.3rem}
.stars button{background:none;border:none;padding:0 .1rem;color:var(--star);font-size:1.8rem}
.toast{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:.55rem 1.2rem;border-radius:999px;
  font-size:.9rem;z-index:30;box-shadow:var(--shadow);animation:rise 140ms var(--ease)}

/* ---- browse ---- */
.browse-head{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.browse-head h1{margin:0}
.sort-label{display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;color:var(--mute)}
.sort-label select{width:auto}
.filters>summary{display:none}
.active-filters{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.product-card{padding:.55rem .55rem 1rem;display:flex;flex-direction:column;gap:.15rem}
.product-card .card-link:hover{text-decoration:none}
.product-title{font:600 1rem/1.35 "Instrument Sans",system-ui,sans-serif;color:var(--ink);margin:.55rem 0 .1rem}
.product-card .seller{font-size:.8rem}
@media(max-width:879px){
 .layout{grid-template-columns:1fr}
 .filters{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:.4rem .8rem}
 .filters>summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-weight:600;cursor:pointer}
 .filters aside{border:0;padding:0 0 .6rem;background:none;position:static}
}
.account{position:relative}
.account>summary{list-style:none;cursor:pointer}
.account>summary::-webkit-details-marker{display:none}
.account-links{display:flex;gap:.6rem;align-items:center}
@media(min-width:761px){.account>summary{display:none}}
@media(max-width:760px){
 .account-links{position:absolute;right:0;top:calc(100% + .45rem);min-width:190px;display:grid;gap:.35rem;
  padding:.5rem;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:10}
 .account-links .pill{width:100%;justify-content:flex-start}
}

/* ---- loading skeletons ---- */
.skeleton{overflow:hidden}
.sk-media{aspect-ratio:4/3;border-radius:calc(var(--r-lg) - 6px);background:var(--chip)}
.sk-line{height:12px;border-radius:6px;background:var(--chip);margin-top:.6rem;width:80%}
.sk-line.short{width:45%}
@media(prefers-reduced-motion:no-preference){
 .skeleton{animation:pulse 1.2s ease-in-out infinite alternate}
 @keyframes pulse{from{opacity:.65}to{opacity:1}}
}

/* ---- cart + checkout ---- */
.field-err{color:var(--bad);font-size:.82rem;margin:.25rem 0 0}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.cart-line{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto auto;gap:.7rem;align-items:center;margin-bottom:.4rem}
.cart-line .media{width:72px;aspect-ratio:1}
.cart-line-body{display:grid;gap:.1rem;min-width:0}
.qty-input{width:72px}
.order-steps{display:flex;list-style:none;padding:0;margin:0;gap:.3rem;flex-wrap:wrap;font-size:.76rem;color:var(--mute)}
.order-steps li{padding:.15rem .5rem;border:1px solid var(--line);border-radius:999px}
.order-steps li.done{background:var(--go-soft);border-color:var(--go);color:var(--go)}
@media(max-width:760px){.cart-line{grid-template-columns:56px 1fr;grid-auto-rows:auto}.cart-line .price,.cart-line .qty-input,.cart-line button{grid-column:2}}
@media(min-width:881px){.two>form>.card:last-child{position:sticky;top:4.6rem}}

/* ---- product page ---- */
.crumbs{display:flex;gap:.45rem;align-items:center;font-size:.85rem;margin-bottom:.8rem}
.product-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:1.7rem;align-items:start}
.product-media{position:sticky;top:4.6rem}
.buybox{position:sticky;top:4.6rem}
.buybox h1{margin-top:0}
.price.big{font-size:1.5rem}
.method-chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.7rem 0}
.buy-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem}
.trust{list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:.3rem;font-size:.84rem;color:var(--mute)}
.trust li::before{content:"✓";color:var(--go);margin-right:.45rem}
.product-detail{max-width:65ch;margin-top:1.8rem}
.product-detail p{overflow-wrap:anywhere}
.stars-static{color:var(--star)}
@media(max-width:880px){
 .product-layout{grid-template-columns:1fr}
 .product-media,.buybox{position:static}
 .mobile-buy{display:flex;position:sticky;bottom:0;z-index:6;align-items:center;gap:.8rem;
   padding:.7rem 1rem;background:var(--card);border-top:1px solid var(--line)}
 .mobile-buy .price{flex:1}
}

/* ---- entry motion ---- */
@media(prefers-reduced-motion:no-preference){
 .grid.stagger>.card{animation:rise var(--dur-3) var(--ease) both}
 .grid.stagger>.card:nth-child(2){animation-delay:24ms}
 .grid.stagger>.card:nth-child(3){animation-delay:48ms}
 .grid.stagger>.card:nth-child(4){animation-delay:72ms}
 @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
 @keyframes fade{from{opacity:0}to{opacity:1}}
 ::view-transition-old(root){animation:fade 160ms var(--ease) both reverse}
 ::view-transition-new(root){animation:fade 160ms var(--ease) both}
 .filters[open] aside{animation:drawer var(--dur-2) var(--ease)}
 @keyframes drawer{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 html{scroll-behavior:auto}
 ::view-transition-old(root),::view-transition-new(root){animation:none!important}
}
  </style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<div class="announce">Fresh finds weekly<span class="sep">✳</span>Pickup or delivery<span class="sep">✳</span>Every order buyer-protected</div>

<nav id="nav"></nav>
<main id="app" tabindex="-1"></main>

<script>
/* ===== Utilities ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CURRENCY="USD";
const money=(m,c=CURRENCY)=>new Intl.NumberFormat("en",{style:"currency",currency:c}).format(m/100);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function toast(t){const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.setAttribute("aria-live","polite");e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)}
function setFieldError(input,message){
 let p=input.parentElement.querySelector(".field-err");
 if(!p){p=document.createElement("p");p.className="field-err";input.parentElement.append(p)}
 const id=`err-${input.name}`;p.id=id;p.textContent=message;
 input.setAttribute("aria-invalid","true");
 input.setAttribute("aria-describedby",id);
}
function clearFieldError(input){
 const p=input.parentElement.querySelector(".field-err");
 if(p)p.remove();
 input.removeAttribute("aria-invalid");
 input.removeAttribute("aria-describedby");
}

/* ===== API client (talks to /api on the server: Postgres-backed) ===== */
async function api(path,opts){const r=await fetch("/api"+path,{credentials:"same-origin",...opts});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Network error");return d}
const call=(method,path,data)=>api(path,data===undefined?{method}:{method,headers:{"content-type":"application/json"},body:JSON.stringify(data)});

/* ===== App state (boots from /api/bootstrap, a Postgres snapshot) ===== */
let db={user:null,categories:[],methods:[],products:[]}; // users come from the session; listings live server-side
function media(p, big=false){
 const title=String(p?.title??"");
 const initials=title.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"M";
 let h=0;for(const ch of String(p?.categoryName??""))h=(h*31+ch.charCodeAt(0))%360;
 const fallback=`<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><rect width="400" height="300" fill="hsl(${h} 30% 86%)"/><text x="200" y="150" text-anchor="middle" dominant-baseline="middle" font-family="Fraunces, Georgia, serif" font-size="84" fill="hsl(${h} 28% 32%)">${esc(initials)}</text></svg>`;
 const img=p?.imageUrl?`<img src="${esc(p.imageUrl)}" alt="${esc(title)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:"";
 return `<div class="media${big?" big":""}">${fallback}${img}</div>`;
}
const full=id=>db.products.find(p=>p.id==id);

class CartItem{constructor(p,q){Object.assign(this,{productId:p.id,sellerId:p.sellerId,titleSnapshot:p.title,unitPriceMinor:p.priceMinor,quantity:q,imageUrl:p.imageUrl??null})}lineTotalMinor(){return this.unitPriceMinor*this.quantity}}
class Cart{
 constructor(){this.items=store.get("mkt_cart",[]);this.persist()}
 persist(){store.set("mkt_cart",this.items)}
 addItem(productId,qty=1){const p=full(productId),it=this.items.find(i=>i.productId==productId);
  if(!p)return; // product went away between renders
  if(it)it.quantity=Math.min(p.qty||1,it.quantity+qty);else this.items.push(new CartItem(p,Math.min(p.qty||1,qty)));this.persist()}
 updateQuantity(id,q){const p=full(id),it=this.items.find(i=>i.productId==id);if(!it)return;
  it.quantity=Math.max(1,Math.min(p?.qty??99,+q||1));this.persist()}
 removeItem(id){this.items=this.items.filter(i=>i.productId!=id);this.persist()}
 groupBySeller(){const g={};this.items.forEach(i=>(g[i.sellerId]??=[]).push(i));return g}
 subtotalMinor(){return this.items.reduce((a,i)=>a+i.lineTotalMinor(),0)}
 count(){return this.items.reduce((a,i)=>a+i.quantity,0)}
 clear(){this.items=[];this.persist()}
}

  if(!l)return `<div class="card"><h1>Listing not found</h1><a href="#/seller">Back to my listings</a></div>`;p=l}

 <div class="two" style="grid-template-columns:1fr 1fr"><div><label>Category</label><select name="categoryId">${db.categories.map(c=>`<option value="${c.id}" ${c.id==p.categoryId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div><div><label>Price (${CURRENCY})</label><input name="price" type="number" step="0.01" min="0.01" required value="${(p.priceMinor/100).toFixed(2)}"></div></div>
 <div class="two" style="grid-template-columns:1fr 1fr"><div><label>Quantity</label><input name="qty" type="number" min="0" required value="${p.qty}"></div><div><label>Status</label><select name="status"><option value="draft" ${p.status=="draft"?"selected":""}>Draft</option><option value="active" ${p.status=="active"?"selected":""}>Active</option><option value="paused" ${p.status=="paused"?"selected":""}>Paused</option></select></div></div>
 <label>Description</label><textarea name="description" rows="4">${esc(p.description)}</textarea>
 <label>Image URL (optional)</label><input name="imageUrl" type="url" maxlength="500" value="${esc(p.imageUrl??"")}" placeholder="https://…"><div class="fhint mute">Use a public http(s) image. Leave blank for a designed fallback.</div>
 <div class="row" style="margin-top:1rem"><button>${isNew?"Publish":"Save changes"}</button><a href="#/seller">Cancel</a></div></form>`};

/* ===== Click Actions and Event Listeners ===== */
const A={
 retry(){route()},
 async logout(){await auth.logout();navbar();route()},
 mode(e){state.mode=e.dataset.m;route()},
 cat(e){catalog.categoryId=+e.dataset.id;keepScroll=true;route()},
 price(){catalog.min=$("#min").value;catalog.max=$("#max").value;keepScroll=true;route()},
 clearf(){catalog.query="";catalog.categoryId=0;catalog.min="";catalog.max="";keepScroll=true;
  if(location.hash.includes("?")){location.hash="#/";return}
  route()},
 add(e){const q=e.hasAttribute("data-qty")?+$("#qty").value:1;cart.addItem(+e.dataset.id,q);navbar();if(cart.items.some(i=>i.productId==+e.dataset.id))toast("Added to cart")},
 buy(e){cart.addItem(+e.dataset.id,+$("#qty").value||1);if(cart.items.length)location.hash="#/cart"},
 qty(e){
  const id=+e.dataset.id;
  cart.updateQuantity(id,e.value);
  const it=cart.items.find(i=>i.productId==id);
  if(!it)return;
  e.value=it.quantity;
  const line=document.querySelector(`[data-line="${id}"]`);
  if(line){const total=line.querySelector("[data-line-total]");if(total)total.textContent=money(it.lineTotalMinor())}
  const subtotal=document.querySelector("[data-subtotal]");
  if(subtotal)subtotal.textContent=money(cart.subtotalMinor());
  navbar();
 },
 rm(e){cart.removeItem(+e.dataset.id);route()},
 cancelOrder(e){if(!confirm("Cancel this unpaid order?"))return;call("POST",`/order/${e.dataset.id}/cancel`).then(()=>{toast("Order cancelled");route()}).catch(x=>toast(x.message))},
 pay(e){const id=+e.dataset.id,st=e.dataset.s;if(st=="captured")cart.clear();navbar();location.hash="#/result/"+id;
  call("POST",`/order/${id}/pay`,{result:st}).then(()=>route()).catch(x=>toast(x.message))},
 receive(e){call("POST",`/seller-orders/${e.dataset.id}/status`,{action:"buyer:receive"}).then(()=>route()).catch(x=>toast(x.message))},
 refund(e){call("POST",`/seller-orders/${e.dataset.id}/refund`).then(()=>{route();toast("Refund requested")}).catch(x=>toast(x.message))},
 review(e){
  const id=+e.dataset.id,trigger=e;
  let r=5;
  const m=document.createElement("div");
  m.className="modal";
  m.setAttribute("role","dialog");
  m.setAttribute("aria-modal","true");
  m.setAttribute("aria-labelledby","review-title");
  m.innerHTML=`<div class="card"><button type="button" class="modal-close" data-x="no" aria-label="Close review dialog">×</button>
   <h2 id="review-title">Review your seller</h2>
   <div class="stars" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button type="button" data-r="${n}" aria-label="${n} star${n===1?"":"s"}" aria-pressed="${n===r}">${n<=r?"★":"☆"}</button>`).join("")}</div>
   <label for="rc">Comment</label><textarea id="rc" rows="4"></textarea>
   <div class="row" style="margin-top:.8rem"><button type="button" data-x="ok">Submit review</button><button type="button" class="ghost" data-x="no">Cancel</button></div>
   <p class="mute">One review per completed order.</p></div>`;
  const previous=document.activeElement;
  const close=()=>{m.remove();document.removeEventListener("keydown",onKey);if(previous instanceof HTMLElement)previous.focus()};
  const focusables=()=>[...m.querySelectorAll('button, textarea, [href], input, select, [tabindex]:not([tabindex="-1"])')].filter(el=>!el.hasAttribute("disabled"));
  const onKey=ev=>{
   if(ev.key==="Escape"){ev.preventDefault();close();return}
   if(ev.key!=="Tab")return;
   const f=focusables(),first=f[0],last=f[f.length-1];
   if(!first)return;
   if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
   else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
  };
  m.addEventListener("click",ev=>{
   const t=ev.target.closest("button");if(!t)return;
   if(t.dataset.r){r=+t.dataset.r;m.querySelectorAll("[data-r]").forEach(b=>{const n=+b.dataset.r;b.textContent=n<=r?"★":"☆";b.setAttribute("aria-pressed",String(n===r))});return}
   if(t.dataset.x==="no"){close();return}
   call("POST","/reviews",{sellerOrderId:id,rating:r,comment:($("#rc")?.value??"")})
    .then(()=>{close();route();toast("Review posted")})
    .catch(x=>toast(x.message));
  });
  document.body.append(m);
  document.addEventListener("keydown",onKey);
  m.querySelector('[data-x="no"]').focus();
 },
 so(e){call("POST",`/seller-orders/${e.dataset.id}/status`,{action:e.dataset.do}).then(()=>route()).catch(x=>toast(x.message))},
 ship(e){const t=prompt("Tracking number (optional)");if(t===null)return;
  call("POST",`/seller-orders/${e.dataset.id}/status`,{action:"seller:ship",tracking:t}).then(()=>route()).catch(x=>toast(x.message))},
 beseller(){auth.becomeSeller().then(()=>{navbar();route();toast("You can now list items for sale")}).catch(x=>toast(x.message))}
};
const state={mode:"login"};
document.addEventListener("click",ev=>{const e=ev.target.closest("[data-act]");if(!e||e.tagName=="INPUT")return;ev.preventDefault();A[e.dataset.act]?.(e)});
document.addEventListener("change",ev=>{if(ev.target.dataset.act=="qty")A.qty(ev.target);if(ev.target.id=="sort"){catalog.sort=ev.target.value;keepScroll=true;route()}});
document.addEventListener("keydown",ev=>{const id=ev.target.id;if(ev.key!="Enter")return;
 if(id=="q"){
  const term=ev.target.value.trim();
  catalog.query=term;
  const next=term?`#/?q=${encodeURIComponent(term)}`:"#/";
  if(location.hash!==next)location.hash=next;else route();
 }
 if(id=="min"||id=="max")A.price()});
document.addEventListener("input",ev=>{if(ev.target.matches('[aria-invalid="true"]'))clearFieldError(ev.target)});
document.addEventListener("submit",ev=>{const f=ev.target,k=f.dataset.form;if(!k)return;ev.preventDefault();
 const d=Object.fromEntries(new FormData(f));const errs=f.querySelectorAll(".err"),err=errs[errs.length-1]||document.getElementById("err");
 (async()=>{
  if(k=="auth"){state.mode=="reg"?await auth.register(d.name,d.email,d.pw):await auth.login(d.email,d.pw);navbar();location.hash=decodeURIComponent(f.dataset.next)}
  else if(k=="checkout"){
   const required=[...f.querySelectorAll("[required]")];
   const missing=required.find(el=>!el.value.trim());
   if(missing){setFieldError(missing,"This field is required.");missing.focus();return}
   required.forEach(clearFieldError);
   checkout.address={name:d.name,phone:d.phone,street:d.street,city:d.city,zip:d.zip};store.set("mkt_addr",checkout.address);
   const m={};Object.keys(cart.groupBySeller()).forEach(s=>m[s]=+d["m"+s]);
   const r=await call("POST","/checkout",{items:cart.items.map(i=>({productId:i.productId,quantity:i.quantity})),address:checkout.address,methods:m});
   location.hash="#/pay/"+r.order}
  else if(k=="listing"){const body={title:d.title.trim(),categoryId:+d.categoryId,priceMinor:Math.round(d.price*100),qty:+d.qty,description:d.description,status:d.status,imageUrl:(d.imageUrl??"").trim()};
   f.dataset.id=="new"?await call("POST","/seller/listings",body):await call("PUT","/seller/listings/"+f.dataset.id,body);
   location.hash="#/seller";toast("Listing saved")}
 })().catch(x=>{if(err)err.textContent=x.message;else toast(x.message)})});

/* ===== Client Router Routing Engine ===== */
async function route(){const [path,qs]=(location.hash.slice(1)||"/").split("?"),q=Object.fromEntries(new URLSearchParams(qs||"")),seg=path.split("/").filter(Boolean);
 const authed=["cart","checkout","orders","seller","pay","result"];let name=seg[0]||"browse",args=seg.slice(1);
 if(name=="seller"&&seg[1]=="edit"){name="edit";args=seg.slice(2)}
 if(name=="browse"&&typeof q.q=="string")catalog.query=q.q;
 if(authed.includes(name)&&needLogin())return;
 if(name=="edit"&&!auth.hasRole("seller")){location.hash="#/seller";return}
 const previousScroll=window.scrollY;
 navbar();
 if(!$("#app").innerHTML.trim())$("#app").innerHTML=name==="browse"?skeletonGrid():'<div class="card empty" role="status"><p class="mute">Loading…</p></div>';
 try{
  const render=async()=>{
   $("#app").innerHTML=await (V[name]||(()=>"<p>Page not found.</p>"))(name=="login"?state:args,q);
   if(window.matchMedia("(max-width:879px)").matches){const fd=$(".filters");if(fd)fd.open=false}
   if(keepScroll)window.scrollTo(0,previousScroll);else{$("#app").focus({preventScroll:true});window.scrollTo(0,0)}
   keepScroll=false;
  };
  if(document.startViewTransition&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
   await document.startViewTransition(render).finished;
  }else{
   await render();
  }
 }catch(x){$("#app").innerHTML=errBox(x.message)}
}

/* ===== Boot: pull a fresh snapshot from the Postgres-backed API ===== */
(async function boot(){
 try{const d=await api("/bootstrap");db.user=d.user;CURRENCY=d.currency??"USD";db.categories=d.categories;db.methods=d.methods;db.products=d.products;
  localStorage.removeItem("mkt_db");localStorage.removeItem("mkt_uid")} // legacy demo stores are gone for good
 catch(x){toast("The market is offline — "+x.message)}
 route()})();
addEventListener("hashchange",route);
</script>
